  </defs>

  <rect width="560" height="400" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="34" fill="#e6edf3" font-size="17" font-weight="600">Where I operate</text>

  <g fill="none" stroke="#21262d">
