        <circle cx="105.2" cy="60.8" r="3.5"/><circle cx="0" cy="105.3" r="3.5"/>
        <circle cx="-95.9" cy="55.4" r="3.5"/><circle cx="-99.4" cy="-57.4" r="3.5"/>
