<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <rect width="880" height="440" rx="14" fill="#0d1117" stroke="#30363d"/>

  <text x="24" y="40" fill="#e6edf3" font-size="19" font-weight="600">The stack I own, end to end</text>
  <text x="290" y="40" fill="#7d8590" font-size="12.5">value flows up — I own the seams, not just one box</text>
  <line x1="24" y1="60" x2="856" y2="60" stroke="#21262d"/>

  <!-- flow rail -->
  <line x1="90" y1="118" x2="90" y2="362" stroke="#1f2937" stroke-width="2"/>
  <polygon points="90,104 85,116 95,116" fill="#7dd3fc" opacity="0.8"/>
  <g fill="#7dd3fc">
    <circle cx="90" cy="362" r="3.5"><animate attributeName="cy" values="362;118" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="362" r="3.5"><animate attributeName="cy" values="362;118" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="362" r="3.5"><animate attributeName="cy" values="362;118" dur="3s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <g>
    <!-- Product -->
    <rect x="112" y="88" width="696" height="52" rx="10" fill="#07333a" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="134" y="119" fill="#22d3ee" font-size="14.5" font-weight="600">Product</text>
    <text x="290" y="119" fill="#9fb0bf" font-size="12.5">Next.js / React dashboards · Flutter mobile wallet · i18n · checkout flows</text>
    <!-- Services -->
    <rect x="112" y="150" width="696" height="52" rx="10" fill="#0b2a45" stroke="#60a5fa" stroke-opacity="0.55"/>
    <text x="134" y="181" fill="#60a5fa" font-size="14.5" font-weight="600">Services</text>
    <text x="290" y="181" fill="#9fb0bf" font-size="12.5">Node + TypeScript APIs · event indexers · webhooks · AI agents · Postgres</text>
    <!-- Contracts -->
    <rect x="112" y="212" width="696" height="52" rx="10" fill="#3b2a06" stroke="#f0b429" stroke-opacity="0.55"/>
    <text x="134" y="243" fill="#f0b429" font-size="14.5" font-weight="600">Contracts</text>
    <text x="290" y="243" fill="#9fb0bf" font-size="12.5">Solidity · Rust (Soroban) · Move (Sui) — proxies, treasury multisig, burn logic</text>
    <!-- Chain -->
    <rect x="112" y="274" width="696" height="52" rx="10" fill="#241a4d" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="134" y="305" fill="#a78bfa" font-size="14.5" font-weight="600">Chain</text>
    <text x="290" y="305" fill="#9fb0bf" font-size="12.5">Polygon / EVM · Stellar–Soroban · Sui · Solana · permissioned Besu · Cosmos appchain</text>
    <!-- Delivery -->
    <rect x="112" y="336" width="696" height="52" rx="10" fill="#05332a" stroke="#34d399" stroke-opacity="0.5" stroke-dasharray="6 4"/>
    <text x="134" y="367" fill="#34d399" font-size="14.5" font-weight="600">Delivery</text>
    <text x="290" y="367" fill="#9fb0bf" font-size="12.5">Tests · coverage gates · CI · Vercel / Railway / Docker — wraps every layer</text>
  </g>

  <text x="112" y="416" fill="#6e7681" font-size="12">Contract → indexer → API → interface. If a merchant has to understand gas, the product isn't finished.</text>
</svg>
